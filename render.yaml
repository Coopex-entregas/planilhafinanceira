services:
  - type: web
    name: coopex-financeiro-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coopex-financeiro-db
          property: connectionString
      - key: CLOUD_API_TOKEN
        generateValue: true
databases:
  - name: coopex-financeiro-db
    plan: free
