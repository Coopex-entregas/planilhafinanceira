<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Borderô</title><style>
body{font-family:Segoe UI,Arial;background:#f4f7fb;margin:0;color:#12243d}.top{background:#06479f;color:#fff;padding:12px 14px}.wrap{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d7e1ec;border-radius:12px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e2e8f0;padding:8px 0}.row:last-child{border:0}input{width:100%;height:44px;font-size:18px;padding:0 10px;box-sizing:border-box}button{width:100%;margin-top:10px;height:44px;background:#0c5fd4;color:#fff;border:0;border-radius:8px;font-weight:700}.muted{color:#68778b;font-size:13px}
</style></head><body><div class=top><b>CONTROLE FINANCEIRO — MEU BORDERÔ</b></div><div class=wrap>
<div id=login class=card><h2>Acessar</h2><div class=muted>Digite os 4 primeiros números da matrícula.</div><input id=pin maxlength=4 inputmode=numeric><button onclick=go()>Entrar</button><div id=err></div></div>
<div id=out></div></div><script>
const R=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function go(){err.textContent='';let r=await fetch('/api/portal/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})});let j=await r.json();if(!r.ok){err.textContent=j.error;return}login.style.display='none';load(j.member_key,j)}
async function load(k,u){let r=await fetch('/api/portal/member/'+encodeURIComponent(k)),j=await r.json();let p=j.payload||{};let contracts=p.contracts||{};let html=`<div class=card><h2>${u.nome}</h2><div class=muted>Matrícula: ${u.matricula||''}</div></div>`;let byWeek={};for(const x of p.productions||[]){(byWeek[x.week]??=[]).push(x)}for(const w of Object.keys(byWeek).sort()){html+=`<div class=card><h3>${p.period?.label||''} — ${w}</h3>`;let total=0;for(const x of byWeek[w]){let n=contracts[x.contract_id]?.nome||'Contrato';total+=Number(x.amount||0);html+=`<div class=row><span>${n}</span><b>${R(x.amount)}</b></div>`}html+=`<div class=row><b>Bruto</b><b>${R(total)}</b></div></div>`}out.innerHTML=html}
</script></body></html>
